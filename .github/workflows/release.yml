name: release

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: webrok-linux-x64
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: webrok-linux-arm64
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: webrok-darwin-x64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: webrok-darwin-arm64
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: webrok-windows-x64.exe
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (Linux arm64)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build
        working-directory: cli
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Stage artifact
        working-directory: cli
        shell: bash
        run: |
          mkdir -p ../dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/webrok.exe ../dist/${{ matrix.asset }}
          else
            cp target/${{ matrix.target }}/release/webrok ../dist/${{ matrix.asset }}
            chmod +x ../dist/${{ matrix.asset }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Rolling build from `main`.

            | Platform | Asset |
            |---|---|
            | Linux x86_64 | `webrok-linux-x64` |
            | Linux ARM64 (also works for Termux) | `webrok-linux-arm64` |
            | macOS Intel | `webrok-darwin-x64` |
            | macOS Apple Silicon | `webrok-darwin-arm64` |
            | Windows x86_64 | `webrok-windows-x64.exe` |
          files: dist/*
          prerelease: false
          make_latest: true
